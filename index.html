<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conta Gráfica ARPE</title>
    <script>
      // Aplica o tema antes de desenhar a página (evita piscar claro→escuro).
      (function () {
        var t = null;
        try { t = localStorage.getItem("cg_tema"); } catch (e) {}
        var escuro = t ? t === "escuro" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = escuro ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
